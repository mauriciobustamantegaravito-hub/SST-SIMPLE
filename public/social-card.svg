<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Saanva SST</title>
  <desc id="desc">Orden que se ve, seguridad que se vive</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2818"/>
      <stop offset="1" stop-color="#064f3c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d479"/>
      <stop offset="1" stop-color="#c8a227"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#03170d" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="-10" r="260" fill="#c8a227" opacity=".13" filter="url(#soft)"/>
  <circle cx="80" cy="670" r="220" fill="#c85f3d" opacity=".12" filter="url(#soft)"/>
  <path d="M0 528 C250 430 360 610 610 505 S1000 390 1200 488 V630 H0Z" fill="#03170d" opacity=".26"/>

  <g transform="translate(72 72)">
