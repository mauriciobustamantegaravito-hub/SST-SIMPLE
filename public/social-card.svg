    <text y="76" fill="#f2d479" font-family="Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">seguridad que se vive.</text>
    <text y="143" fill="#d8e4d7" font-family="Arial, sans-serif" font-size="24" font-weight="400">Herramientas prácticas para organizar tu SST</text>
    <rect y="186" width="280" height="52" rx="26" fill="#c8a227"/>
    <text x="140" y="219" text-anchor="middle" fill="#0d2818" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="1">EXPLORA LA PLATAFORMA</text>
  </g>

  <g transform="translate(785 95)" filter="url(#shadow)">
    <rect width="330" height="430" rx="34" fill="#fffaf0"/>
    <rect x="18" y="18" width="294" height="394" rx="24" fill="#f2e9d8"/>
    <circle cx="165" cy="187" r="112" fill="none" stroke="#d5c9b3" stroke-width="18"/>
    <circle cx="165" cy="187" r="112" fill="none" stroke="#c8a227" stroke-width="18" stroke-linecap="round" stroke-dasharray="478 704" transform="rotate(-90 165 187)"/>
    <text x="165" y="195" text-anchor="middle" fill="#0d2818" font-family="Arial, sans-serif" font-size="72" font-weight="800">68</text>
    <text x="165" y="227" text-anchor="middle" fill="#467060" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">AVANCE 5S</text>
    <rect x="65" y="278" width="200" height="12" rx="6" fill="#d6c9b4"/>
