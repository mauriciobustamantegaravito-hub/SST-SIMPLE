    <path d="M31 12 47 19v13c0 12-7 22-16 27-9-5-16-15-16-27V19l16-7Z" fill="#0d2818"/>
    <path d="m23 32 6 6 11-13" fill="none" stroke="#f8e8b1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
