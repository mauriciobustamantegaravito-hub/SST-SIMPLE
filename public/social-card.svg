    <text x="84" y="58" fill="#f2d479" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5">SEGURIDAD Y SALUD EN EL TRABAJO</text>
  </g>

  <g transform="translate(74 190)">
